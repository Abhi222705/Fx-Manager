<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FX Manager</title>

    <script src="./auth.js"></script>
    <link rel="stylesheet" href="./style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
        }

        .auth-brand { text-align: center; margin-bottom: 24px; }
        .auth-brand h1 { font-size: 26px; margin-bottom: 4px; }
        .auth-brand p { color: var(--green); font-weight: bold; font-size: 15px; }

        .auth-tabs {
            display: flex;
            gap: 6px;
            background: var(--bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }

        .auth-tabs button.active {
            background: rgba(32, 216, 151, .14);
            color: var(--green);
            font-weight: bold;
        }

        .auth-form { display: none; flex-direction: column; gap: 14px; }
        .auth-form.active { display: flex; }

        .auth-form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

        .auth-form input[type="text"],
        .auth-form input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus { border-color: var(--green); }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .auth-submit {
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: var(--green);
            color: #07110d;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-submit:disabled { opacity: .6; cursor: default; }

        .auth-error { min-height: 18px; color: var(--red); font-size: 13px; }
        .auth-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="auth-brand">
        <h1>FX Manager</h1>
        <p>Trading Journal</p>
    </div>

    <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Sign in</button>
        <button type="button" id="tabRegister">Create account</button>
    </div>

    <!-- SIGN IN -->
    <div class="auth-form active" id="loginForm">

        <div>
            <label for="loginUser">Username</label>
            <input type="text" id="loginUser" autocomplete="username">
        </div>

        <div>
            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" autocomplete="current-password">
        </div>

        <label class="remember">
            <input type="checkbox" id="loginRemember" checked>
            Keep me signed in on this device
        </label>

        <div class="auth-error" id="loginError"></div>

        <button type="button" class="auth-submit" id="loginBtn">Sign in</button>
    </div>

    <!-- CREATE ACCOUNT -->
    <div class="auth-form" id="registerForm">

        <div>
            <label for="regName">Your name</label>
            <input type="text" id="regName" autocomplete="name">
        </div>

        <div>
            <label for="regUser">Username</label>
            <input type="text" id="regUser" autocomplete="username">
        </div>

        <div>
            <label for="regPass">Password (min 6 characters)</label>
            <input type="password" id="regPass" autocomplete="new-password">
        </div>

        <div>
            <label for="regPass2">Confirm password</label>
            <input type="password" id="regPass2" autocomplete="new-password">
        </div>

        <div class="auth-note" id="legacyNote" style="display:none;">
            Trades and settings already saved in this browser will be moved into this first account.
        </div>

        <div class="auth-error" id="regError"></div>

        <button type="button" class="auth-submit" id="registerBtn">Create account</button>
    </div>

</div>

<script>
    var $ = function (id) { return document.getElementById(id); };

    /* Already signed in? Go straight to the dashboard. */
    if (FXAuth.current()) {
        location.replace("index.html");
    }

    if (FXAuth.hasLegacyData()) {
        $("legacyNote").style.display = "block";
    }

    function showTab(which) {
        var isLogin = which === "login";
        $("tabLogin").classList.toggle("active", isLogin);
        $("tabRegister").classList.toggle("active", !isLogin);
        $("loginForm").classList.toggle("active", isLogin);
        $("registerForm").classList.toggle("active", !isLogin);
    }

    $("tabLogin").onclick = function () { showTab("login"); };
    $("tabRegister").onclick = function () { showTab("register"); };

    function doLogin() {
        var btn = $("loginBtn");
        $("loginError").textContent = "";

        if (!$("loginUser").value.trim() || !$("loginPass").value) {
            $("loginError").textContent = "Enter your username and password.";
            return;
        }

        btn.disabled = true;

        FXAuth.login($("loginUser").value, $("loginPass").value, $("loginRemember").checked)
            .then(function () { location.href = "index.html"; })
            .catch(function (err) {
                $("loginError").textContent = err.message;
                btn.disabled = false;
            });
    }

    function doRegister() {
        var btn = $("registerBtn");
        var err = $("regError");
        err.textContent = "";

        var name = $("regName").value.trim();
        var user = $("regUser").value.trim();
        var pass = $("regPass").value;

        if (!name || !user) { err.textContent = "Please fill in your name and a username."; return; }
        if (!/^[a-zA-Z0-9_.-]{3,30}$/.test(user)) {
            err.textContent = "Username: 3-30 letters, numbers, . _ or -";
            return;
        }
        if (pass.length < 6) { err.textContent = "Password must be at least 6 characters."; return; }
        if (pass !== $("regPass2").value) { err.textContent = "Passwords do not match."; return; }

        btn.disabled = true;

        FXAuth.register(name, user, pass)
            .then(function () { return FXAuth.login(user, pass, true); })
            .then(function () { location.href = "index.html"; })
            .catch(function (e) {
                err.textContent = e.message;
                btn.disabled = false;
            });
    }

    $("loginBtn").onclick = doLogin;
    $("registerBtn").onclick = doRegister;

    ["loginUser", "loginPass"].forEach(function (id) {
        $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
    });
    ["regName", "regUser", "regPass", "regPass2"].forEach(function (id) {
        $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") doRegister(); });
    });
</script>

</body>
</html>
